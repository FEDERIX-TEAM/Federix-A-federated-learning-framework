services:
  mongo:
    image: mongo:7
    container_name: federix-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: federix-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: federix-central-server
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongo:27017/federix_central
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change_me_access_secret
      JWT_REFRESH_SECRET: change_me_refresh_secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      INTERNAL_SERVICE_TOKEN: change_me_shared_internal_token
      FL_SERVER_ALLOWED_IPS: "127.0.0.1,::1"
      SIGNED_URL_SECRET: change_me_signed_url_secret
      SUPPORTED_SDK_VERSIONS: "1.0.0,1.1.0"
      SERVER_TIMEZONE: Asia/Kolkata
      MAX_UPDATE_SIZE_MB: "256"
      BUILD_ID: docker-local
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo-data:
