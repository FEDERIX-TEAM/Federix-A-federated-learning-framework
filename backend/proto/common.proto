syntax = "proto3";

package federix.v1;

// Generic empty request/response for RPCs that need no payload.
message Empty {}

// Roles recognized across the platform (design.md §4 RBAC matrix).
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SUPER_ADMIN = 1;
  ROLE_ADMIN = 2;
  ROLE_FL_ENGINEER = 3;
  ROLE_VIEWER = 4;
  ROLE_SDK_CLIENT = 5;
}

enum RoundStatus {
  ROUND_STATUS_UNSPECIFIED = 0;
  ROUND_STATUS_PENDING = 1;
  ROUND_STATUS_ACTIVE = 2;
  ROUND_STATUS_AGGREGATING = 3;
  ROUND_STATUS_COMPLETE = 4;
  ROUND_STATUS_FAILED = 5;
  ROUND_STATUS_ABORTED = 6;
}

enum UpdateStatus {
  UPDATE_STATUS_UNSPECIFIED = 0;
  UPDATE_STATUS_PENDING = 1;
  UPDATE_STATUS_ACCEPTED = 2;
  UPDATE_STATUS_COMPRESSED = 3;
  UPDATE_STATUS_REJECTED = 4;
}

enum CompressionLevel {
  COMPRESSION_LEVEL_UNSPECIFIED = 0;
  COMPRESSION_LEVEL_NONE = 1;
  COMPRESSION_LEVEL_PARTIAL = 2;
  COMPRESSION_LEVEL_FULL = 3;
}

// A generic {string: double} map, used for label_distribution payloads.
message LabelDistribution {
  map<string, double> counts = 1;
}

// A generic {string: string} map, used for free-form device_info / details payloads.
message StringMap {
  map<string, string> entries = 1;
}

message StatusResponse {
  bool success = 1;
}

enum RoundReadyReason {
  ROUND_READY_REASON_UNSPECIFIED = 0;
  ROUND_READY_REASON_DEADLINE = 1;
  ROUND_READY_REASON_ALL_SUBMITTED = 2;
  ROUND_READY_REASON_MAX_UPDATES = 3;
  ROUND_READY_REASON_KEEPALIVE = 4;
  ROUND_READY_REASON_RESUMED = 5;
}

enum FlServerState {
  FL_SERVER_STATE_UNSPECIFIED = 0;
  FL_SERVER_STATE_STARTING = 1;
  FL_SERVER_STATE_IDLE = 2;
  FL_SERVER_STATE_AGGREGATING = 3;
  FL_SERVER_STATE_ERROR = 4;
}

message SignedUrl {
  string url = 1;
  string expires_at = 2;
  string refresh_until = 3;
  int64 max_bytes = 4;
}

message UtilityConfig {
  double weight_quality = 1;
  double weight_size = 2;
  double weight_diversity = 3;
  double size_saturation = 4;
  int32 num_classes = 5;
  double temperature = 6;
  double threshold_high = 7;
  double threshold_low = 8;
  double ratio_high = 9;
  double ratio_medium = 10;
  double ratio_low = 11;
  double reject_below = 12;
}

message UtilityConfigUpdate {
  optional double weight_quality = 1;
  optional double weight_size = 2;
  optional double weight_diversity = 3;
  optional double size_saturation = 4;
  optional int32 num_classes = 5;
  optional double temperature = 6;
  optional double ratio_high = 7;
  optional double ratio_medium = 8;
  optional double ratio_low = 9;
  optional double reject_below = 10;
}
