[project]
name = "federix"
version = "0.1.0"
description = "Utility-aware, communication-efficient federated learning on FedProx (CPU-only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "torch", "torchvision", "federix-sdk"]

[project.scripts]
federix-server = "federix.fl_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/federix"]

# CPU-only PyTorch (small download) instead of the CUDA build
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
federix-sdk = { path = "../sdk", editable = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
