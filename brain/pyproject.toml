[project]
name = "federix"
version = "0.1.0"
description = "Utility-aware, communication-efficient federated learning on FedProx (CPU-only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "torchvision"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/federix"]

# CPU-only PyTorch (small download) instead of the CUDA build
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
