[project]
name = "federix-sdk"
version = "1.1.0"
description = "Python SDK for Federix federated-learning clients"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "protobuf>=7.35.1,<8", "numpy>=1.26"]

[project.optional-dependencies]
torch = ["torch>=2.2"]
jax = ["jax>=0.4.30"]
keras = ["keras>=3.5", "jax>=0.4.30"]

[dependency-groups]
dev = ["pytest>=8", "grpcio-tools>=1.68", "torch>=2.2", "torchvision>=0.17", "jax>=0.4.30", "keras>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/federix_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
